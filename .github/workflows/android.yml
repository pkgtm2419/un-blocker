name: Android checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Compiler and release-policy tests
        run: python -m unittest discover -s tools/filter-compiler -p 'test_*.py' -v
      - name: Build and test
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug -Dorg.gradle.java.home="${JAVA_HOME}"
      - name: Report rule count and checksum
        run: python -c "import json; m=json.load(open('app/build/generated/dns-assets/dns-rules-manifest.json')); print('rules=',m['ruleCount'],'sha256=',m['rulesSha256'])"
      - uses: actions/upload-artifact@v4
        with:
          name: ub-blocker-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/ub-blocker-*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/corpus/
            app/build/generated/dns-assets/dns-rules-manifest.json
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash gradlew connectedDebugAndroidTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
