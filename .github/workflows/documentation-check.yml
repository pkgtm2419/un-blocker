name: Documentation contracts and drift
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test documentation tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_*.py' -v
      - name: Validate Markdown, skills and rules
        run: python3 scripts/docs_contract.py
      - name: Check generated inventories for source drift
        run: python3 scripts/docs_sync.py --check
