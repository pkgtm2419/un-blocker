name: Kotlin coding standards
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotlin-style-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the style runner
        run: python3 -m unittest discover -s scripts/tests -p 'test_kotlin_style.py' -v
      - name: Check Kotlin source and build scripts
        run: python3 scripts/kotlin_style.py --download-tool
