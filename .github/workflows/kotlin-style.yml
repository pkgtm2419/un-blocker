name: Kotlin coding standards
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotlin-style-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the style runner
        run: python3 -m unittest discover -s scripts/tests -p 'test_kotlin_style.py' -v
      - name: Check Kotlin source and build scripts
        run: python3 scripts/kotlin_style.py --download-tool
