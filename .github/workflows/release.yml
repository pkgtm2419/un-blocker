name: Publish release APK

on:
  push:
    tags:
      - 'test-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to use current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Verify tag matches app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)"
          test -n "${VERSION_NAME}"

          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi

          if [[ "${TAG}" == test-v* ]]; then
            EXPECTED_TAG="test-v${VERSION_NAME}"
            TITLE="Un-Blocker ${VERSION_NAME} test build"
            PRERELEASE_FLAG="--prerelease"
            NOTES="Stable test-signed build. Not a production store release. APK signer SHA-256: 0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e. Builds signed by an older test key require a one-time uninstall."
          elif [[ "${TAG}" == v* ]]; then
            EXPECTED_TAG="v${VERSION_NAME}"
            TITLE="Un-Blocker ${VERSION_NAME}"
            PRERELEASE_FLAG=""
            NOTES="Release build for Un-Blocker v${VERSION_NAME}."
          else
            EXPECTED_TAG="test-v${VERSION_NAME}"
            TITLE="Un-Blocker ${VERSION_NAME} test build"
            PRERELEASE_FLAG="--prerelease"
            NOTES="Automated build for ${VERSION_NAME}."
          fi

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ -z "${{ inputs.tag_name }}" ]; then
            test "${TAG}" = "${EXPECTED_TAG}" || {
              echo "Error: Tag ${TAG} does not match expected tag ${EXPECTED_TAG}" >&2
              exit 1
            }
          fi

          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_TITLE=${TITLE}" >> "${GITHUB_ENV}"
          echo "PRERELEASE_FLAG=${PRERELEASE_FLAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_NOTES=${NOTES}" >> "${GITHUB_ENV}"
          echo "APK_PATH=app/build/outputs/apk/debug/ub-blocker-${VERSION_NAME}.apk" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"

      - name: Prepare stable test signing key
        id: prepare_signing
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "${TEST_KEYSTORE_BASE64}" ]; then
            umask 077
            printf '%s' "${TEST_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ub-blocker-test.keystore"
            echo "has_keystore=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No custom keystore provided. Standard debug signing will be used."
            echo "has_keystore=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Test and build APK
        env:
          UB_BLOCKER_KEYSTORE_FILE: ${{ steps.prepare_signing.outputs.has_keystore == 'true' && format('{0}/ub-blocker-test.keystore', runner.temp) || '' }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f "${APK_PATH}"
          if [ "${{ steps.prepare_signing.outputs.has_keystore }}" = "true" ]; then
            export APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
            bash scripts/verify-apk-signature.sh \
              "${APK_PATH}" \
              "0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            ${PRERELEASE_FLAG} \
            --verify-tag || \
          gh release upload "${RELEASE_TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
