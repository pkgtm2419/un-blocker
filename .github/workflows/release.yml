name: Publish release APK

on:
  push:
    tags: ['test-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (must match app version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Validate tag and require stable signing
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag_name }}
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
        run: python scripts/release-policy.py
      - name: Prepare stable signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "${TEST_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ub-blocker-test.keystore"
          test -s "${RUNNER_TEMP}/ub-blocker-test.keystore"
      - name: Test compiler and release policy
        run: python -m unittest discover -s tools/filter-compiler -p 'test_*.py' -v
      - name: Test and build APK
        env:
          UB_BLOCKER_KEYSTORE_FILE: ${{ runner.temp }}/ub-blocker-test.keystore
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "${BUILD_TYPE}" = release ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          bash gradlew testDebugUnitTest lintDebug "${TASK}" -Dorg.gradle.java.home="${JAVA_HOME}"
      - name: Verify stable APK signer
        shell: bash
        run: |
          export APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          bash scripts/verify-apk-signature.sh "${APK_PATH}" "0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Un-Blocker ${VERSION_NAME}" \
            --notes "Stable-signed ${BUILD_TYPE} APK. On-device DNS protection; see README for limitations." \
            ${PRERELEASE_FLAG}
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ub-blocker-test.keystore"
