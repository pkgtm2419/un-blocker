name: Publish release APK

on:
  push:
    tags:
      - 'test-v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to build (dry run) or publish'
        required: true
        type: string
      dry_run:
        description: 'Build and verify only; do not publish'
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (tag, version, branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
      build_type: ${{ steps.policy.outputs.build_type }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      environment: ${{ steps.policy.outputs.environment }}
      apk_path: ${{ steps.policy.outputs.apk_path }}
    steps:
      - name: Checkout tag (full history for the main-branch check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag_name && format('refs/tags/{0}', inputs.tag_name) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version and branch policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then tag="${INPUT_TAG}"; fi
          python3 scripts/release-policy.py preflight --tag "${tag}" --github-output "${GITHUB_OUTPUT}"
      - name: Repository hygiene
        run: bash scripts/check-no-binaries.sh

  verify:
    name: Test, lint and R8 smoke build (no secrets)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
      - name: Dependency verification metadata must exist
        run: test -s gradle/verification-metadata.xml
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Tooling tests
        run: |
          set -euo pipefail
          bash scripts/tests/run-all.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
          (cd tools/filter-compiler && python3 -m unittest discover -p 'test_*.py')
      - name: Unit tests, lint and R8 smoke build
        run: bash gradlew testDebugUnitTest lintDebug lintRelease assembleReleaseTest
      - name: Upload reports (also on failure)
        if: ${{ always() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-verify-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html

  publish:
    name: Sign, verify and publish
    needs: [preflight, verify]
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.preflight.outputs.environment }}
    permissions:
      contents: write # create the GitHub release and upload its assets (only job with write access)
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION_NAME: ${{ needs.preflight.outputs.version }}
      BUILD_TYPE: ${{ needs.preflight.outputs.build_type }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      APK_PATH: ${{ needs.preflight.outputs.apk_path }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Check signing secrets exist (names only are printed)
        env:
          UB_BLOCKER_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
          UB_RELEASE_KEYSTORE_BASE64: ${{ secrets.UB_RELEASE_KEYSTORE_BASE64 }}
          UB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.UB_RELEASE_KEYSTORE_PASSWORD }}
          UB_RELEASE_KEY_ALIAS: ${{ secrets.UB_RELEASE_KEY_ALIAS }}
          UB_RELEASE_KEY_PASSWORD: ${{ secrets.UB_RELEASE_KEY_PASSWORD }}
        run: python3 scripts/release-policy.py secrets --build-type "${BUILD_TYPE}"
      - name: Prepare signing keystore
        id: keys
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.UB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore="${RUNNER_TEMP}/ub-blocker-signing.keystore"
          if [ "${BUILD_TYPE}" = "release" ]; then
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            echo "release_keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          else
            printf '%s' "${TEST_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            echo "test_keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build signed APK
        env:
          UB_BLOCKER_KEYSTORE_FILE: ${{ steps.keys.outputs.test_keystore }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
          UB_RELEASE_KEYSTORE_FILE: ${{ steps.keys.outputs.release_keystore }}
          UB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.UB_RELEASE_KEYSTORE_PASSWORD }}
          UB_RELEASE_KEY_ALIAS: ${{ secrets.UB_RELEASE_KEY_ALIAS }}
          UB_RELEASE_KEY_PASSWORD: ${{ secrets.UB_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${BUILD_TYPE}" = "release" ]; then
            bash gradlew assembleRelease
          else
            bash gradlew assembleDebug
          fi
      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/ub-blocker-signing.keystore"
      - name: Verify APK before publishing
        env:
          UB_RELEASE_SIGNER_SHA256: ${{ vars.UB_RELEASE_SIGNER_SHA256 }}
          UB_TEST_SIGNER_SHA256: ${{ vars.UB_TEST_SIGNER_SHA256 || '0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e' }}
        run: |
          set -euo pipefail
          test -f "${APK_PATH}"
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          if [ ! -d "${build_tools}" ]; then
            build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [ "${BUILD_TYPE}" = "release" ]; then
            if "${build_tools}/aapt2" dump badging "${APK_PATH}" | grep -q application-debuggable; then
              echo "Release APK must not be debuggable" >&2; exit 1
            fi
            test -n "${UB_RELEASE_SIGNER_SHA256}" || { echo "Repository variable UB_RELEASE_SIGNER_SHA256 is required" >&2; exit 1; }
            APKSIGNER="${build_tools}/apksigner" bash scripts/verify-apk-signature.sh "${APK_PATH}" "${UB_RELEASE_SIGNER_SHA256}"
          else
            APKSIGNER="${build_tools}/apksigner" bash scripts/verify-apk-signature.sh "${APK_PATH}" "${UB_TEST_SIGNER_SHA256}"
          fi
      - name: Checksums
        run: |
          set -euo pipefail
          cd "$(dirname "${APK_PATH}")"
          sha256sum "$(basename "${APK_PATH}")" > SHA256SUMS
      - name: Publish (assets are immutable; no overwrite)
        run: |
          set -euo pipefail
          dir="$(dirname "${APK_PATH}")"
          assets=("${APK_PATH}" "${dir}/SHA256SUMS")
          if [ "${BUILD_TYPE}" = "release" ] && [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            assets+=("app/build/outputs/mapping/release/mapping.txt")
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            title="Un-Blocker ${VERSION_NAME} test build"
            notes="Test-signed build for testing only (debuggable). Verify with SHA256SUMS."
            flags=(--prerelease)
          else
            title="Un-Blocker ${VERSION_NAME}"
            notes="Production release ${VERSION_NAME}. Verify with SHA256SUMS."
            flags=()
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            count="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
            if [ "${count}" -gt 0 ]; then
              echo "Release ${TAG} already has ${count} asset(s); published assets are immutable. Bump the version." >&2
              exit 1
            fi
            gh release upload "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" "${flags[@]}"
          else
            gh release create "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" --notes "${notes}" --verify-tag "${flags[@]}"
          fi
      - name: Post-publish verification (downloads and re-checks the published assets)
        env:
          UB_RELEASE_SIGNER_SHA256: ${{ vars.UB_RELEASE_SIGNER_SHA256 }}
          UB_TEST_SIGNER_SHA256: ${{ vars.UB_TEST_SIGNER_SHA256 || '0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e' }}
        run: |
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          if [ ! -d "${build_tools}" ]; then
            build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          AAPT2="${build_tools}/aapt2" APKSIGNER="${build_tools}/apksigner" bash scripts/verify-release.sh "${TAG}"
