name: Publish release APK

on:
  push:
    tags:
      - 'test-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to use current ref)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0bdd871935719febd78681f197cd39af5b6e16a6 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Verify no tracked binaries
        shell: bash
        run: bash scripts/check-no-binaries.sh
      - name: Validate tag and release policy
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.UB_RELEASE_KEYSTORE_BASE64 }}
          UB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.UB_RELEASE_KEYSTORE_PASSWORD }}
          UB_RELEASE_KEY_ALIAS: ${{ secrets.UB_RELEASE_KEY_ALIAS }}
          UB_RELEASE_KEY_PASSWORD: ${{ secrets.UB_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          fi
          if ! [[ "${TAG}" =~ ^(v|test-v)[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid tag format '${TAG}'. Must match ^(v|test-v)[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          fi
          export RELEASE_INPUT_TAG="${TAG}"
          python3 scripts/release-policy.py

      - name: Prepare signing keys
        id: prepare_signing
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.UB_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          if [ "${BUILD_TYPE}" = "release" ]; then
            if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
              echo "Error: Release keystore secret is required for production builds." >&2
              exit 1
            fi
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ub-blocker-release.keystore"
            echo "release_keystore_path=${RUNNER_TEMP}/ub-blocker-release.keystore" >> "${GITHUB_OUTPUT}"
          else
            if [ -z "${TEST_KEYSTORE_BASE64}" ]; then
              echo "Error: Test keystore secret is required for test builds." >&2
              exit 1
            fi
            printf '%s' "${TEST_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ub-blocker-test.keystore"
            echo "test_keystore_path=${RUNNER_TEMP}/ub-blocker-test.keystore" >> "${GITHUB_OUTPUT}"
          fi

      - name: Test and build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          UB_BLOCKER_KEYSTORE_FILE: ${{ steps.prepare_signing.outputs.test_keystore_path }}
          UB_BLOCKER_KEYSTORE_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEYSTORE_PASSWORD }}
          UB_BLOCKER_KEY_ALIAS: ${{ secrets.UB_BLOCKER_TEST_KEY_ALIAS }}
          UB_BLOCKER_KEY_PASSWORD: ${{ secrets.UB_BLOCKER_TEST_KEY_PASSWORD }}
          UB_RELEASE_KEYSTORE_FILE: ${{ steps.prepare_signing.outputs.release_keystore_path }}
          UB_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.UB_RELEASE_KEYSTORE_PASSWORD }}
          UB_RELEASE_KEY_ALIAS: ${{ secrets.UB_RELEASE_KEY_ALIAS }}
          UB_RELEASE_KEY_PASSWORD: ${{ secrets.UB_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "${BUILD_TYPE}" = "release" ]; then
            bash gradlew testDebugUnitTest lintDebug lintRelease assembleRelease --dependency-verification=off -Dorg.gradle.java.home="${JAVA_HOME}"
          else
            bash gradlew testDebugUnitTest lintDebug assembleDebug --dependency-verification=off -Dorg.gradle.java.home="${JAVA_HOME}"
          fi

      - name: Verify APK non-debuggable and signature
        env:
          UB_RELEASE_SIGNER_SHA256: ${{ vars.UB_RELEASE_SIGNER_SHA256 }}
        shell: bash
        run: |
          test -f "${APK_PATH}"
          export APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          export AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"

          if [ "${BUILD_TYPE}" = "release" ]; then
            # Verify APK is not debuggable
            if "${AAPT2}" dump badging "${APK_PATH}" | grep -q "application-debuggable"; then
              echo "Error: Release APK must not be debuggable!" >&2
              exit 1
            fi
            if [ -n "${UB_RELEASE_SIGNER_SHA256}" ]; then
              bash scripts/verify-apk-signature.sh "${APK_PATH}" "${UB_RELEASE_SIGNER_SHA256}"
            else
              echo "Error: UB_RELEASE_SIGNER_SHA256 is required for production builds." >&2
              exit 1
            fi
          else
            bash scripts/verify-apk-signature.sh "${APK_PATH}" "0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e"
          fi

      - name: Generate Checksums
        shell: bash
        run: |
          cd "$(dirname "${APK_PATH}")"
          sha256sum "$(basename "${APK_PATH}")" > SHA256SUMS
          echo "CHECKSUM_PATH=$(dirname "${APK_PATH}")/SHA256SUMS" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ASSETS=("${APK_PATH}" "${CHECKSUM_PATH}")
          MAPPING_PATH="app/build/outputs/mapping/release/mapping.txt"
          if [ "${BUILD_TYPE}" = "release" ] && [ -f "${MAPPING_PATH}" ]; then
            RELEASE_ASSETS+=("${MAPPING_PATH}")
          fi

          TITLE="Un-Blocker ${VERSION_NAME}"
          if [ "${PRERELEASE_FLAG}" = "--prerelease" ]; then
            TITLE="Un-Blocker ${VERSION_NAME} test build"
            NOTES="Stable test-signed build. Not a production store release. APK signer SHA-256: 0686161d8dc3051bfda2e03dd0406e1a6cddadf38c976f606bd8c474a872374e."
          else
            NOTES="Production release for Un-Blocker v${VERSION_NAME}."
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Updating assets..."
            gh release upload "${RELEASE_TAG}" "${RELEASE_ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            echo "Creating new release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" "${RELEASE_ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              ${PRERELEASE_FLAG} \
              --verify-tag
          fi

      - name: Post-publish Verification
        env:
          GH_TOKEN: ${{ github.token }}
          UB_RELEASE_SIGNER_SHA256: ${{ vars.UB_RELEASE_SIGNER_SHA256 }}
        shell: bash
        run: |
          bash scripts/verify-release.sh "${RELEASE_TAG}"

      - name: Update README.md with new release links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          sed -i "s|Download-APK%20(v[0-9\.]*)|Download-APK%20(v${VERSION_NAME})|g" README.md
          sed -i "s|development-[0-9\.]*|development-${VERSION_NAME}|g" README.md
          sed -i "s|\[Development [0-9\.]*\]|[Development ${VERSION_NAME}]|g" README.md
          sed -i "s|download/[^/]*/ub-blocker-[0-9\.]*\.apk|download/${RELEASE_TAG}/ub-blocker-${VERSION_NAME}.apk|g" README.md
          sed -i "s|Download_APK-ub--blocker--[0-9\.]*\.apk|Download_APK-ub--blocker--${VERSION_NAME}.apk|g" README.md
          sed -i "s|\*\*[\`]*ub-blocker-[0-9\.]*\.apk[\`]*\*\*|\*\*\`ub-blocker-${VERSION_NAME}.apk\`\*\*|g" README.md
          sed -i "s|Release \`[^\`]*\` Notes|Release \`${RELEASE_TAG}\` Notes|g" README.md
          sed -i "s|releases/tag/[^)]*|releases/tag/${RELEASE_TAG}|g" README.md

          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update download links for ${RELEASE_TAG} [skip ci]"
            git push origin main
          fi
