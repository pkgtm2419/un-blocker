name: Publish test APK

on:
  push:
    tags:
      - 'test-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Verify tag matches app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)"
          EXPECTED_TAG="test-v${VERSION_NAME}"
          test -n "${VERSION_NAME}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_TAG}"
          echo "APK_PATH=app/build/outputs/apk/debug/ub-blocker-${VERSION_NAME}.apk" >> "${GITHUB_ENV}"
          echo "VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
      - name: Test and build test APK
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK
        shell: bash
        run: test -f "${APK_PATH}"
      - name: Publish debug-signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Un-Blocker ${VERSION_NAME} test build" \
            --notes "Debug-signed test build. Not a production-signed release. Uninstall an older test build if Android rejects an update because the debug signing key changed." \
            --prerelease \
            --verify-tag
