plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def stableTestKeystorePath = System.getenv('UB_BLOCKER_KEYSTORE_FILE')
def stableTestKeystorePassword = System.getenv('UB_BLOCKER_KEYSTORE_PASSWORD')
def stableTestKeyAlias = System.getenv('UB_BLOCKER_KEY_ALIAS')
def stableTestKeyPassword = System.getenv('UB_BLOCKER_KEY_PASSWORD')
def stableTestSigningValues = [
    stableTestKeystorePath,
    stableTestKeystorePassword,
    stableTestKeyAlias,
    stableTestKeyPassword
]
def hasAnyStableTestSigningValue = stableTestSigningValues.any { it != null && !it.isBlank() }
def hasStableTestSigning = stableTestSigningValues.every { it != null && !it.isBlank() }

if (hasAnyStableTestSigningValue && !hasStableTestSigning) {
    throw new GradleException('Stable test signing requires all UB_BLOCKER_KEYSTORE_* environment variables.')
}

android {
    namespace 'com.unblocker.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.unblocker.app"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasStableTestSigning) {
            stableTest {
                storeFile file(stableTestKeystorePath)
                storePassword stableTestKeystorePassword
                keyAlias stableTestKeyAlias
                keyPassword stableTestKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableTestSigning) {
                signingConfig signingConfigs.stableTest
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    sourceSets {
        main.assets.srcDir "$buildDir/generated/legal-assets"
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "ub-blocker-${variant.versionName}.apk"
        }
    }
}

tasks.register('copyLegalAssets', Copy) {
    from rootProject.files('LICENSE', 'NOTICE', 'PRIVACY.md', 'DATASETS.md', 'THIRD_PARTY_NOTICES.md')
    into "$buildDir/generated/legal-assets/licenses"
}
tasks.named('preBuild').configure { dependsOn 'copyLegalAssets' }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.3'

    def composeBom = platform('androidx.compose:compose-bom:2024.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
